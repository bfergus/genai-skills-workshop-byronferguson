<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Alaska Department of Snow ❄️</title>
<style>
  :root {
    --ads-blue-deep: #0b3d66;
    --ads-blue: #1565a6;
    --ads-blue-light: #d6ecff;
    --ads-snow: #f7fbff;
    --ads-ice: #eaf4ff;
    --ads-text: #112a3d;
    --ads-muted: #5a7388;
    --ads-warn-bg: #fde7e7;
    --ads-warn-border: #c0392b;
    --ads-warn-text: #6b1a13;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, var(--ads-blue-light) 0%, var(--ads-snow) 100%);
    color: var(--ads-text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--ads-blue-deep);
    color: white;
    padding: 18px 24px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  header h1 { margin: 0; font-size: 22px; font-weight: 600; }
  header .sub { margin-top: 4px; font-size: 13px; opacity: 0.85; }
  main {
    flex: 1;
    display: flex;
    justify-content: center;
    padding: 24px;
  }
  .chat-card {
    width: 100%;
    max-width: 780px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 6px 24px rgba(11, 61, 102, 0.12);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    height: calc(100vh - 180px);
    min-height: 500px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    background: var(--ads-snow);
  }
  .msg {
    margin-bottom: 14px;
    max-width: 90%;
    padding: 10px 14px;
    border-radius: 10px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    background: var(--ads-blue);
    color: white;
    margin-left: auto;
  }
  .msg.assistant {
    background: var(--ads-ice);
    color: var(--ads-text);
    border: 1px solid #cfe2f6;
  }
  .msg.blocked {
    background: var(--ads-warn-bg);
    color: var(--ads-warn-text);
    border: 1px solid var(--ads-warn-border);
  }
  .sender {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.8;
    margin-bottom: 4px;
  }
  .sources {
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px dashed #b8d2eb;
    font-size: 11px;
    color: var(--ads-muted);
  }
  .sources strong { color: var(--ads-blue-deep); }
  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }
  .suggestion-chip {
    background: white;
    border: 1px solid var(--ads-blue);
    color: var(--ads-blue-deep);
    border-radius: 16px;
    padding: 6px 12px;
    font-size: 12.5px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    font-family: inherit;
  }
  .suggestion-chip:hover {
    background: var(--ads-blue);
    color: white;
  }
  .suggestion-chip:active {
    transform: translateY(1px);
  }
  .suggestions-label {
    margin-top: 10px;
    font-size: 12px;
    color: var(--ads-muted);
    font-weight: 600;
  }
  .input-row {
    display: flex;
    padding: 12px;
    background: white;
    border-top: 1px solid #e0e9f2;
    gap: 8px;
  }
  #q {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid #c5d6e6;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  #q:focus { border-color: var(--ads-blue); }
  #send {
    background: var(--ads-blue);
    color: white;
    border: 0;
    padding: 0 22px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
    transition: background 0.15s;
  }
  #send:hover:not(:disabled) { background: var(--ads-blue-deep); }
  #send:disabled { background: #9bb3c7; cursor: not-allowed; }
  .loading {
    display: inline-block;
    padding: 8px 12px;
    color: var(--ads-muted);
    font-style: italic;
    font-size: 13px;
  }
  .loading .dots::after {
    content: " ❄️"; animation: spin 1.4s linear infinite;
    display: inline-block;
  }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  footer {
    text-align: center;
    padding: 10px;
    font-size: 12px;
    color: var(--ads-muted);
  }
</style>
</head>
<body>
<header>
  <h1>❄️ Alaska Department of Snow</h1>
  <div class="sub">Citizen Information Assistant ❄️ — ask about plowing, road conditions, school closures, and more.</div>
</header>
<main>
  <div class="chat-card">
    <div id="messages"></div>
    <div class="input-row">
      <input id="q" type="text" placeholder="Ask about snow plowing, closures, road conditions..." autocomplete="off" />
      <button id="send">Send ❄️</button>
    </div>
  </div>
</main>
<footer>Powered by Gemini + Vertex AI ❄️ Alaska Department of Snow</footer>

<script>
const SESSION_KEY = "ads_session_id";
function getSessionId() {
  let s = localStorage.getItem(SESSION_KEY);
  if (!s) {
    s = crypto.randomUUID();
    localStorage.setItem(SESSION_KEY, s);
  }
  return s;
}

const msgs = document.getElementById("messages");
const input = document.getElementById("q");
const sendBtn = document.getElementById("send");

function addMessage(sender, text, opts = {}) {
  const div = document.createElement("div");
  div.className = "msg " + (sender === "user" ? "user" : (opts.blocked ? "blocked" : "assistant"));
  const senderLabel = document.createElement("div");
  senderLabel.className = "sender";
  senderLabel.textContent = sender === "user" ? "You" : (opts.blocked ? "❄️ Blocked" : "❄️ ADS Assistant");
  div.appendChild(senderLabel);
  const body = document.createElement("div");
  body.textContent = text;
  div.appendChild(body);
  if (opts.sources && opts.sources.length) {
    const src = document.createElement("div");
    src.className = "sources";
    src.innerHTML = "<strong>Sources:</strong> " + opts.sources.map(s => s.replace(/_/g, " ")).join(", ");
    div.appendChild(src);
  }
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function addLoading() {
  const div = document.createElement("div");
  div.className = "msg assistant";
  div.id = "loading-msg";
  div.innerHTML = '<div class="sender">❄️ ADS Assistant</div><span class="loading">Thinking<span class="dots"></span></span>';
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

async function send() {
  const q = input.value.trim();
  if (!q) return;
  input.value = "";
  sendBtn.disabled = true;
  addMessage("user", q);
  const loading = addLoading();
  try {
    const resp = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, session_id: getSessionId() }),
    });
    const data = await resp.json();
    loading.remove();
    addMessage("assistant", data.answer || "(no response)", {
      blocked: !!data.blocked,
      sources: data.sources || [],
    });
  } catch (err) {
    loading.remove();
    addMessage("assistant", "Network error: " + err.message, { blocked: true });
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });

// Example prompts grouped by category — click to auto-fill and send
const EXAMPLE_PROMPTS = [
  { label: "🛣️ Road conditions",     prompt: "What are the current road conditions?" },
  { label: "🚧 Road closures",        prompt: "Are there any road closures right now?" },
  { label: "✈️ Airport status",       prompt: "What is the current status of the Anchorage airport?" },
  { label: "🌡️ Weather forecast",    prompt: "What's the weather forecast for Anchorage this week?" },
  { label: "❄️ Current weather",     prompt: "What is the current weather in Fairbanks?" },
  { label: "🚜 Plowing schedule",     prompt: "When will my street be plowed?" },
  { label: "🏫 School closures",     prompt: "How do I find out about school closures during a snow emergency?" },
  { label: "📞 Contact ADS",          prompt: "How do I contact the Alaska Department of Snow?" },
];

function addGreeting() {
  const div = document.createElement("div");
  div.className = "msg assistant";
  div.innerHTML = `
    <div class="sender">❄️ ADS Assistant</div>
    <div>❄️ Welcome! I'm the Alaska Department of Snow assistant. Ask me about plowing schedules, road conditions, closures, weather, or any of our services.</div>
    <div class="suggestions-label">Try one of these to get started:</div>
    <div class="suggestions" id="suggestions"></div>
  `;
  msgs.appendChild(div);

  const chipContainer = div.querySelector("#suggestions");
  EXAMPLE_PROMPTS.forEach(({ label, prompt }) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "suggestion-chip";
    btn.textContent = label;
    btn.title = prompt;
    btn.addEventListener("click", () => {
      input.value = prompt;
      send();
    });
    chipContainer.appendChild(btn);
  });
}

addGreeting();
input.focus();
</script>
</body>
</html>
